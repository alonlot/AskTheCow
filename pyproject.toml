[project]
name = "askthecow"
version = "0.1.0"
description = "Chat bot that answers electrical engineers' questions about an embedded firmware repository (master branch only)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
askthecow = "askthecow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["askthecow*"]

[tool.setuptools.package-data]
askthecow = ["static/*"]
